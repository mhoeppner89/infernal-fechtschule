<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Infernal Fechtschule — Animation QA Gallery</title>
  <script>
    (() => {
      const localHosts = new Set(['localhost', '127.0.0.1', '::1']);
      if (!localHosts.has(window.location.hostname) && !window.location.hostname.endsWith('.localhost')) {
        window.location.replace('./');
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #100f11;
      color: #eee8dc;
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-width: 100%;
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 50% 0, rgba(111, 77, 47, 0.2), transparent 42rem),
        #100f11;
    }

    body { overflow: auto; }

    button,
    select { font: inherit; }

    button,
    select {
      min-height: 34px;
      color: #eee8dc;
      border: 1px solid #655b50;
      border-radius: 4px;
      background: #29262a;
    }

    button { padding: 0 12px; cursor: pointer; }
    button:hover { background: #373137; }

    .shell {
      width: min(100%, 1160px);
      margin: 0 auto;
      padding: 12px 10px 24px;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin: 0 auto 10px;
      width: min(100%, 844px);
    }

    h1,
    h2,
    p { margin: 0; }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.05rem, 2.5vw, 1.45rem);
      letter-spacing: 0.025em;
    }

    .dev-label,
    .status-line,
    .hint {
      color: #bfb4a3;
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .dev-label { color: #d4a965; white-space: nowrap; }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(250px, 1fr) auto auto auto auto;
      gap: 6px;
      width: min(100%, 844px);
      margin: 0 auto 8px;
    }

    select { width: 100%; padding: 0 9px; }

    .stage,
    .gallery-row {
      width: min(100%, 844px);
      margin: 0 auto;
      border: 1px solid #514a43;
      border-radius: 6px;
      overflow: hidden;
      background: #181719;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.32);
    }

    canvas {
      display: block;
      width: 844px;
      max-width: 100%;
      height: auto;
      background: #181719;
    }

    .readout {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 18px;
      align-items: start;
      width: min(100%, 844px);
      margin: 8px auto 0;
    }

    pre {
      min-height: 54px;
      margin: 0;
      padding: 9px 10px;
      overflow: auto;
      border: 1px solid #45403c;
      border-radius: 4px;
      color: #e1d8c8;
      background: #171619;
      font: 0.72rem/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .status-line { padding: 8px 0; text-align: right; }
    .status-line[data-kind="ok"] { color: #95ca99; }
    .status-line[data-kind="error"] { color: #ee8e7b; }
    .failures { grid-column: 1 / -1; color: #ee8e7b; }
    .failures:empty { display: none; }

    .group-board {
      display: grid;
      gap: 8px;
      width: min(100%, 844px);
      margin: 0 auto;
    }

    .group-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      width: min(100%, 844px);
      margin: 0 auto 8px;
    }

    .group-heading h2 { font: 700 1rem/1.2 Georgia, "Times New Roman", serif; }

    .row-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 10px 5px;
      border-bottom: 1px solid #45403c;
      color: #ddd2c0;
      font-size: 0.75rem;
    }

    .row-label span:last-child { color: #a99e8d; }
    [hidden] { display: none !important; }

    @media (max-width: 860px) {
      .shell { padding: 7px 0 18px; }
      header,
      .toolbar,
      .readout,
      .group-heading { padding-inline: 7px; }
      .toolbar { grid-template-columns: minmax(220px, 1fr) repeat(4, auto); }
      .stage,
      .gallery-row { border-radius: 0; border-inline: 0; }
      .readout { grid-template-columns: 1fr; }
      .status-line { display: none; }
    }
  </style>
</head>
<body data-gallery-ready="false">
  <main class="shell">
    <header>
      <div>
        <h1>Animation QA Gallery</h1>
        <p class="hint">All authored poses at the game’s 844 × 390 phone scale</p>
      </div>
      <span class="dev-label">Development only</span>
    </header>

    <section id="inspector">
      <div class="toolbar" aria-label="Animation gallery controls">
        <select id="clip-select" aria-label="Animation clip"></select>
        <button id="previous-frame" type="button" aria-label="Previous pose">− Pose</button>
        <button id="play-toggle" type="button">Play</button>
        <button id="next-frame" type="button" aria-label="Next pose">+ Pose</button>
        <button id="next-clip" type="button" aria-label="Next clip">Next</button>
      </div>

      <div class="stage">
        <canvas id="pose-board" width="844" height="270" aria-label="Four numbered animation poses"></canvas>
      </div>

      <div class="readout">
        <pre id="state-output">Loading compiled animation catalog…</pre>
        <p id="status-line" class="status-line">Loading assets</p>
        <pre id="failure-output" class="failures"></pre>
      </div>
    </section>

    <section id="group-view" hidden>
      <div class="group-heading">
        <div>
          <h2 id="group-title">Animation evidence</h2>
          <p class="hint">Each row keeps the same phone-height render scale</p>
        </div>
        <span id="group-status" class="dev-label"></span>
      </div>
      <div id="group-board" class="group-board"></div>
    </section>
  </main>

  <script type="module">
    import { ATTACKS } from './js/sim/attacks.js';
    import {
      animationFrameIndex,
      attackAnimationFrameIndex,
      SpriteAnimationCatalog
    } from './js/render/animation-catalog.js';
    import {
      ANIMATION_MANIFEST,
      ANIMATION_TICKS_PER_SECOND
    } from './js/render/animation-manifest.js';

    const PHONE_VERTICAL_SCALE = 390 / 720;
    const BOARD_WIDTH = 844;
    const BOARD_HEIGHT = 270;
    const TICK_MS = 1000 / ANIMATION_TICKS_PER_SECOND;
    const readyClips = ANIMATION_MANIFEST.filter((clip) => clip.availability === 'ready');
    const clipById = new Map(readyClips.map((clip) => [clip.id, clip]));
    const catalog = new SpriteAnimationCatalog(ANIMATION_MANIFEST);
    const resolvedFrames = new Map();

    const elements = {
      inspector: document.querySelector('#inspector'),
      groupView: document.querySelector('#group-view'),
      groupTitle: document.querySelector('#group-title'),
      groupStatus: document.querySelector('#group-status'),
      groupBoard: document.querySelector('#group-board'),
      select: document.querySelector('#clip-select'),
      previousFrame: document.querySelector('#previous-frame'),
      playToggle: document.querySelector('#play-toggle'),
      nextFrame: document.querySelector('#next-frame'),
      nextClip: document.querySelector('#next-clip'),
      board: document.querySelector('#pose-board'),
      stateOutput: document.querySelector('#state-output'),
      statusLine: document.querySelector('#status-line'),
      failureOutput: document.querySelector('#failure-output')
    };

    let galleryReady = false;
    let galleryError = null;
    let selectedClipId = readyClips[0]?.id ?? '';
    let forcedFrameIndex = 0;
    let playbackTick = 0;
    let playing = false;
    let lastAnimationTime = 0;
    let animationRemainder = 0;

    function clipGroup(clip) {
      return clip.archetype === 'meyer'
        ? `Meyer — ${clip.weapon}`
        : clip.archetype[0].toUpperCase() + clip.archetype.slice(1);
    }

    function populateSelect() {
      const groups = new Map();
      for (const clip of readyClips) {
        const label = clipGroup(clip);
        const list = groups.get(label) ?? [];
        list.push(clip);
        groups.set(label, list);
      }
      elements.select.replaceChildren();
      for (const [label, clips] of groups) {
        const group = document.createElement('optgroup');
        group.label = label;
        for (const clip of clips) {
          const option = document.createElement('option');
          option.value = clip.id;
          option.textContent = clip.state === 'attack'
            ? `${clip.attackId} · attack`
            : clip.state;
          group.append(option);
        }
        elements.select.append(group);
      }
      elements.select.value = selectedClipId;
    }

    function positiveHold(frame) {
      return Math.max(1, Math.floor(frame.holdTicks));
    }

    function totalAuthoredTicks(clip) {
      return clip.frames.reduce((sum, frame) => sum + positiveHold(frame), 0);
    }

    function attackDuration(clip) {
      const definition = clip.attackId ? ATTACKS[clip.attackId] : null;
      return definition
        ? definition.startup + definition.active + definition.recovery
        : totalAuthoredTicks(clip) / ANIMATION_TICKS_PER_SECOND;
    }

    function playbackDurationTicks(clip) {
      return clip.state === 'attack'
        ? Math.max(1, Math.ceil(attackDuration(clip) * ANIMATION_TICKS_PER_SECOND))
        : totalAuthoredTicks(clip);
    }

    function cuePhase(cue) {
      if (cue === 'anticipation') return 'anticipation';
      if (cue === 'contact') return 'contact';
      if (cue === 'overshoot' || cue === 'recovery') return 'recovery';
      return 'neutral';
    }

    function elapsedForFrame(clip, targetIndex) {
      if (clip.state !== 'attack' || !clip.attackId || !ATTACKS[clip.attackId]) {
        const before = clip.frames
          .slice(0, targetIndex)
          .reduce((sum, frame) => sum + positiveHold(frame), 0);
        const hold = positiveHold(clip.frames[targetIndex]);
        return (before + hold * 0.5) / ANIMATION_TICKS_PER_SECOND;
      }

      const definition = ATTACKS[clip.attackId];
      const phase = cuePhase(clip.frames[targetIndex].cue);
      const phaseIndices = clip.frames
        .map((frame, index) => cuePhase(frame.cue) === phase ? index : -1)
        .filter((index) => index >= 0);
      const phaseTotal = phaseIndices.reduce(
        (sum, index) => sum + positiveHold(clip.frames[index]),
        0
      );
      let before = 0;
      for (const index of phaseIndices) {
        if (index === targetIndex) break;
        before += positiveHold(clip.frames[index]);
      }
      const progress = (before + positiveHold(clip.frames[targetIndex]) * 0.5) / phaseTotal;
      if (phase === 'anticipation') return progress * definition.startup;
      if (phase === 'contact') return definition.startup + progress * definition.active;
      if (phase === 'recovery') {
        return definition.startup + definition.active + progress * definition.recovery;
      }
      return progress * attackDuration(clip);
    }

    function resolveEveryFrame() {
      resolvedFrames.clear();
      for (const clip of readyClips) {
        const frames = clip.frames.map((frame, index) => {
          // QA inspection resolves each authored pose directly. Live attack
          // playback mapping is validated separately in validateClip().
          const resolved = catalog.resolveFrameByIndex(clip, index);
          return {
            resolved,
            loaded: Boolean(
              resolved
              && resolved.frameIndex === index
              && resolved.image.complete
              && resolved.image.naturalWidth > 0
              && resolved.image.naturalHeight > 0
            )
          };
        });
        resolvedFrames.set(clip.id, frames);
      }
    }

    function currentClip() {
      return clipById.get(selectedClipId) ?? readyClips[0] ?? null;
    }

    function frameIndexAtTick(clip, tick) {
      const elapsed = tick / ANIMATION_TICKS_PER_SECOND;
      return clip.state === 'attack' && clip.attackId
        ? attackAnimationFrameIndex(clip, clip.attackId, elapsed)
        : animationFrameIndex(clip, elapsed, 0);
    }

    function activeFrameIndex() {
      const clip = currentClip();
      if (!clip) return 0;
      if (forcedFrameIndex !== null) return forcedFrameIndex;
      return frameIndexAtTick(clip, playbackTick);
    }

    function activeResolved() {
      const clip = currentClip();
      if (!clip) return null;
      return resolvedFrames.get(clip.id)?.[activeFrameIndex()]?.resolved ?? null;
    }

    function drawChecker(context, width, height) {
      context.fillStyle = '#171619';
      context.fillRect(0, 0, width, height);
      const size = 26;
      for (let y = 0; y < height; y += size) {
        for (let x = 0; x < width; x += size) {
          context.fillStyle = ((x / size + y / size) % 2 === 0) ? '#1c1b1f' : '#242126';
          context.fillRect(x, y, size, size);
        }
      }
      const gradient = context.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, 'rgba(11, 10, 12, 0.12)');
      gradient.addColorStop(0.7, 'rgba(11, 10, 12, 0)');
      gradient.addColorStop(1, 'rgba(11, 10, 12, 0.64)');
      context.fillStyle = gradient;
      context.fillRect(0, 0, width, height);
    }

    function drawClipBoard(canvas, clip, highlightedIndex = -1) {
      const context = canvas.getContext('2d');
      if (!context) return;
      canvas.width = BOARD_WIDTH;
      canvas.height = BOARD_HEIGHT;
      context.imageSmoothingEnabled = true;
      drawChecker(context, BOARD_WIDTH, BOARD_HEIGHT);

      const cellWidth = BOARD_WIDTH / clip.frames.length;
      const groundY = 239;
      const entries = resolvedFrames.get(clip.id) ?? [];
      context.strokeStyle = 'rgba(239, 222, 189, 0.22)';
      context.lineWidth = 1;
      context.beginPath();
      context.moveTo(0, groundY + 0.5);
      context.lineTo(BOARD_WIDTH, groundY + 0.5);
      context.stroke();

      for (let index = 0; index < clip.frames.length; index += 1) {
        const frame = clip.frames[index];
        const entry = entries[index];
        const resolved = entry?.resolved ?? null;
        const left = cellWidth * index;
        const centreX = left + cellWidth * 0.5;

        if (index > 0) {
          context.strokeStyle = 'rgba(239, 222, 189, 0.1)';
          context.beginPath();
          context.moveTo(left + 0.5, 0);
          context.lineTo(left + 0.5, BOARD_HEIGHT);
          context.stroke();
        }

        if (resolved) {
          const height = clip.display.height * resolved.scaleCorrection * PHONE_VERTICAL_SCALE;
          const width = resolved.image.naturalWidth / Math.max(1, resolved.image.naturalHeight) * height;
          const x = centreX - width * clip.display.anchorX + clip.display.offsetX * PHONE_VERTICAL_SCALE;
          const y = groundY - height * clip.display.anchorY + clip.display.offsetY * PHONE_VERTICAL_SCALE;
          context.save();
          context.filter = clip.archetype === 'meyer'
            ? 'drop-shadow(0 0 2px rgba(248, 216, 151, 0.7))'
            : 'none';
          context.drawImage(resolved.image, x, y, width, height);
          context.restore();
        } else {
          context.fillStyle = '#dd725f';
          context.font = '700 12px system-ui, sans-serif';
          context.textAlign = 'center';
          context.fillText('ASSET FAILED', centreX, 132);
        }

        const cueColor = frame.cue === 'contact' ? '#f0bb63'
          : frame.cue === 'anticipation' ? '#93b7d2'
            : frame.cue === 'recovery' || frame.cue === 'overshoot' ? '#b5a0cf'
              : '#aeb7a6';
        context.textAlign = 'left';
        context.font = '800 12px system-ui, sans-serif';
        context.fillStyle = '#f0e9dc';
        context.fillText(`POSE ${index + 1}`, left + 9, 18);
        context.font = '700 10px system-ui, sans-serif';
        context.fillStyle = cueColor;
        context.fillText(frame.cue.toUpperCase(), left + 9, 34);
        context.textAlign = 'right';
        context.fillStyle = '#8e877c';
        context.fillText(`${positiveHold(frame)}t`, left + cellWidth - 9, 18);

        if (index === highlightedIndex) {
          context.strokeStyle = '#e3b45e';
          context.lineWidth = 3;
          context.strokeRect(left + 2.5, 2.5, cellWidth - 5, BOARD_HEIGHT - 5);
        }
      }
    }

    function readiness() {
      return catalog.getReadiness();
    }

    function publicState() {
      const clip = currentClip();
      const resolved = activeResolved();
      const frameIndex = activeFrameIndex();
      const frame = clip?.frames[frameIndex] ?? null;
      const report = readiness();
      return {
        mode: 'animation-gallery',
        ready: galleryReady,
        clipId: clip?.id ?? null,
        frameIndex,
        cue: frame?.cue ?? null,
        scaleCorrection: resolved?.scaleCorrection ?? null,
        phoneRenderHeightPx: clip && resolved
          ? Number((clip.display.height * resolved.scaleCorrection * PHONE_VERTICAL_SCALE).toFixed(3))
          : null,
        tick: playbackTick,
        playing,
        playback: clip?.playback ?? null,
        assetFailures: report.failures,
        galleryError
      };
    }

    function renderInspector() {
      const clip = currentClip();
      if (!clip) return;
      drawClipBoard(elements.board, clip, activeFrameIndex());
      elements.select.value = clip.id;
      elements.playToggle.textContent = playing ? 'Pause' : 'Play';
      elements.stateOutput.textContent = JSON.stringify(publicState(), null, 2);
      const report = readiness();
      const complete = report.loadedAssets === report.declaredAssets && report.failedAssets === 0;
      elements.statusLine.textContent = complete
        ? `${report.readyClips}/${report.declaredClips} clips · ${report.loadedAssets}/${report.declaredAssets} frames`
        : `${report.pendingAssets} pending · ${report.failedAssets} failed`;
      elements.statusLine.dataset.kind = complete ? 'ok' : report.failedAssets > 0 ? 'error' : '';
      elements.failureOutput.textContent = report.failures.length > 0
        ? JSON.stringify({ assetFailures: report.failures }, null, 2)
        : '';
    }

    function selectClip(id) {
      if (!clipById.has(id)) throw new Error(`Unknown ready clip: ${id}`);
      selectedClipId = id;
      forcedFrameIndex = 0;
      playbackTick = 0;
      playing = false;
      animationRemainder = 0;
      renderInspector();
      return publicState();
    }

    function selectFrame(index) {
      const clip = currentClip();
      if (!clip) throw new Error('No ready clips are available.');
      if (!Number.isInteger(index) || index < 0 || index >= clip.frames.length) {
        throw new Error(`Frame index ${index} is outside ${clip.id}.`);
      }
      forcedFrameIndex = index;
      playbackTick = Math.max(0, Math.floor(elapsedForFrame(clip, index) * ANIMATION_TICKS_PER_SECOND));
      playing = false;
      renderInspector();
      return publicState();
    }

    function stepTicks(ticks = 1) {
      const clip = currentClip();
      if (!clip) return publicState();
      playing = false;
      forcedFrameIndex = null;
      const duration = playbackDurationTicks(clip);
      const amount = Number.isFinite(ticks) ? Math.trunc(ticks) : 0;
      playbackTick = ((playbackTick + amount) % duration + duration) % duration;
      renderInspector();
      return publicState();
    }

    function setTime(seconds) {
      const clip = currentClip();
      if (!clip) return publicState();
      const duration = playbackDurationTicks(clip);
      forcedFrameIndex = null;
      playing = false;
      playbackTick = ((Math.floor(Math.max(0, seconds) * ANIMATION_TICKS_PER_SECOND) % duration) + duration) % duration;
      renderInspector();
      return publicState();
    }

    function setPlaying(value) {
      const clip = currentClip();
      if (!clip) return publicState();
      if (value && forcedFrameIndex !== null) {
        playbackTick = Math.max(
          0,
          Math.floor(elapsedForFrame(clip, forcedFrameIndex) * ANIMATION_TICKS_PER_SECOND)
        );
      }
      forcedFrameIndex = null;
      playing = Boolean(value);
      lastAnimationTime = 0;
      animationRemainder = 0;
      renderInspector();
      return publicState();
    }

    function validateClip(id) {
      const clip = clipById.get(id);
      if (!clip) return { clipId: id, ok: false, errors: [`Unknown ready clip: ${id}`] };
      const errors = [];
      const entries = resolvedFrames.get(id) ?? [];
      const reached = new Set();

      for (let index = 0; index < clip.frames.length; index += 1) {
        const entry = entries[index];
        if (!entry?.loaded) errors.push(`Pose ${index + 1} did not resolve to a loaded image.`);
        if (entry?.resolved?.frameIndex !== index) {
          errors.push(`Pose ${index + 1} resolved as frame ${entry?.resolved?.frameIndex ?? 'null'}.`);
        } else {
          reached.add(index);
        }
      }

      let loopWraps = null;
      if (clip.playback === 'loop') {
        const total = totalAuthoredTicks(clip);
        const loopReached = new Set();
        for (let tick = 0; tick < total; tick += 1) {
          loopReached.add(animationFrameIndex(clip, tick / ANIMATION_TICKS_PER_SECOND, 0));
        }
        const wrapped = animationFrameIndex(
          clip,
          (total + 0.25) / ANIMATION_TICKS_PER_SECOND,
          0
        );
        loopWraps = wrapped === 0;
        if (!loopWraps) errors.push(`Loop wrapped to frame ${wrapped + 1}, not frame 1.`);
        for (let index = 0; index < clip.frames.length; index += 1) {
          if (!loopReached.has(index)) errors.push(`Loop playback never reaches pose ${index + 1}.`);
        }
      }

      let attackContactWithinActiveWindow = null;
      if (clip.state === 'attack' && clip.attackId) {
        const definition = ATTACKS[clip.attackId];
        if (!definition) {
          errors.push(`Missing attack definition for ${clip.attackId}.`);
          attackContactWithinActiveWindow = false;
        } else {
          attackContactWithinActiveWindow = true;
          const duration = definition.startup + definition.active + definition.recovery;
          const sampleRate = ANIMATION_TICKS_PER_SECOND * 10;
          const sampleCount = Math.ceil(duration * sampleRate);
          const visited = new Set();
          for (let sample = 0; sample <= sampleCount; sample += 1) {
            const elapsed = Math.min(duration, sample / sampleRate);
            const index = attackAnimationFrameIndex(clip, clip.attackId, elapsed);
            visited.add(index);
            const cue = clip.frames[index]?.cue;
            const active = elapsed >= definition.startup
              && elapsed < definition.startup + definition.active;
            if ((cue === 'contact') !== active) {
              attackContactWithinActiveWindow = false;
              errors.push(
                `Contact mismatch at ${elapsed.toFixed(5)}s: cue=${cue}, active=${active}.`
              );
              break;
            }
          }
          // Live attack playback deliberately skips the leading neutral
          // bookend so accepted input shows anticipation immediately. Every
          // other authored pose must be visited by the timing sweep.
          let leadingNeutral = 0;
          while (clip.frames[leadingNeutral]?.cue === 'neutral') leadingNeutral += 1;
          for (let index = leadingNeutral; index < clip.frames.length; index += 1) {
            if (!visited.has(index)) {
              errors.push(`Attack timing never reaches pose ${index + 1}.`);
            }
          }
        }
      }

      return {
        clipId: id,
        ok: errors.length === 0,
        frameCount: clip.frames.length,
        cues: clip.frames.map((frame) => frame.cue),
        scaleCorrection: entries[0]?.resolved?.scaleCorrection ?? null,
        resolvedFrames: reached.size,
        loopWraps,
        attackContactWithinActiveWindow,
        errors
      };
    }

    function describeClips() {
      return readyClips.map((clip) => ({
        id: clip.id,
        archetype: clip.archetype,
        weapon: clip.weapon,
        state: clip.state,
        attackId: clip.attackId,
        playback: clip.playback,
        frameCount: clip.frames.length,
        frames: clip.frames.map((frame, frameIndex) => ({
          frameIndex,
          cue: frame.cue,
          holdTicks: frame.holdTicks,
          url: frame.url,
          loaded: resolvedFrames.get(clip.id)?.[frameIndex]?.loaded ?? false
        }))
      }));
    }

    function showGroup(ids, title = 'Animation evidence') {
      const clips = ids.map((id) => {
        const clip = clipById.get(id);
        if (!clip) throw new Error(`Unknown ready clip: ${id}`);
        return clip;
      });
      playing = false;
      elements.inspector.hidden = true;
      elements.groupView.hidden = false;
      elements.groupTitle.textContent = title;
      elements.groupStatus.textContent = `${clips.length} clip${clips.length === 1 ? '' : 's'}`;
      elements.groupBoard.replaceChildren();
      for (const clip of clips) {
        const row = document.createElement('article');
        row.className = 'gallery-row';
        row.dataset.clipId = clip.id;
        const label = document.createElement('div');
        label.className = 'row-label';
        const name = document.createElement('strong');
        name.textContent = clip.id;
        const meta = document.createElement('span');
        meta.textContent = `${clip.playback} · correction ${(resolvedFrames.get(clip.id)?.[0]?.resolved?.scaleCorrection ?? 1).toFixed(3)}`;
        label.append(name, meta);
        const canvas = document.createElement('canvas');
        canvas.width = BOARD_WIDTH;
        canvas.height = BOARD_HEIGHT;
        canvas.setAttribute('aria-label', `${clip.id} numbered poses`);
        row.append(label, canvas);
        elements.groupBoard.append(row);
        drawClipBoard(canvas, clip, -1);
      }
      return { title, clipIds: clips.map((clip) => clip.id) };
    }

    function showInspector() {
      elements.groupView.hidden = true;
      elements.inspector.hidden = false;
      renderInspector();
      return publicState();
    }

    function nextClip() {
      const index = Math.max(0, readyClips.findIndex((clip) => clip.id === selectedClipId));
      return selectClip(readyClips[(index + 1) % readyClips.length].id);
    }

    function animationLoop(time) {
      if (playing && galleryReady) {
        if (lastAnimationTime === 0) lastAnimationTime = time;
        animationRemainder += Math.max(0, Math.min(100, time - lastAnimationTime));
        lastAnimationTime = time;
        const clip = currentClip();
        if (clip) {
          let changed = false;
          const duration = playbackDurationTicks(clip);
          while (animationRemainder >= TICK_MS) {
            playbackTick = (playbackTick + 1) % duration;
            animationRemainder -= TICK_MS;
            changed = true;
          }
          if (changed) renderInspector();
        }
      } else {
        lastAnimationTime = time;
      }
      requestAnimationFrame(animationLoop);
    }

    async function waitForCatalog() {
      catalog.preload();
      const deadline = performance.now() + 20000;
      while (readiness().pendingAssets > 0 && performance.now() < deadline) {
        await new Promise((resolve) => setTimeout(resolve, 25));
      }
      const report = readiness();
      if (report.pendingAssets > 0) {
        throw new Error(`Timed out with ${report.pendingAssets} animation assets pending.`);
      }
      resolveEveryFrame();
      galleryReady = true;
      document.body.dataset.galleryReady = 'true';
      renderInspector();
      return publicState();
    }

    populateSelect();

    const readyPromise = waitForCatalog().catch((error) => {
      galleryError = String(error?.stack ?? error);
      document.body.dataset.galleryReady = 'error';
      elements.stateOutput.textContent = galleryError;
      elements.statusLine.textContent = 'Gallery failed';
      elements.statusLine.dataset.kind = 'error';
      throw error;
    });

    window.animationGallery = Object.freeze({
      ready: () => readyPromise,
      status: () => ({ ready: galleryReady, error: galleryError, readiness: readiness() }),
      listClips: describeClips,
      getState: publicState,
      getReadiness: readiness,
      selectClip,
      selectFrame,
      step: stepTicks,
      setTime,
      play: () => setPlaying(true),
      pause: () => setPlaying(false),
      validateClip,
      validateAll: () => readyClips.map((clip) => validateClip(clip.id)),
      showGroup,
      showInspector
    });
    window.render_game_to_text = () => JSON.stringify(publicState());
    window.advanceTime = (milliseconds) => {
      const ticks = Math.max(0, Math.round(Number(milliseconds) / TICK_MS));
      return stepTicks(ticks);
    };

    elements.select.addEventListener('change', () => selectClip(elements.select.value));
    elements.previousFrame.addEventListener('click', () => {
      const clip = currentClip();
      if (!clip) return;
      selectFrame((activeFrameIndex() - 1 + clip.frames.length) % clip.frames.length);
    });
    elements.nextFrame.addEventListener('click', () => {
      const clip = currentClip();
      if (!clip) return;
      selectFrame((activeFrameIndex() + 1) % clip.frames.length);
    });
    elements.playToggle.addEventListener('click', () => setPlaying(!playing));
    elements.nextClip.addEventListener('click', nextClip);
    window.addEventListener('keydown', (event) => {
      if (event.code === 'Space') {
        event.preventDefault();
        setPlaying(!playing);
      } else if (event.code === 'ArrowRight') {
        event.preventDefault();
        stepTicks(1);
      } else if (event.code === 'ArrowLeft') {
        event.preventDefault();
        stepTicks(-1);
      }
    });

    requestAnimationFrame(animationLoop);
  </script>
</body>
</html>
